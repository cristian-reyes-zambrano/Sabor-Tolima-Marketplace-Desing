<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600">
  <defs>
    <!-- Gradientes de fondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a00"/>
      <stop offset="45%" style="stop-color:#3d1200"/>
      <stop offset="100%" style="stop-color:#1a0a00"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="50%" r="45%">
      <stop offset="0%" style="stop-color:#c62828;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#1a0a00;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#e65100;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#1a0a00;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="plateGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0ece8"/>
    </radialGradient>
    <radialGradient id="steamGrad" cx="50%" cy="100%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circleClip">
      <circle cx="980" cy="300" r="220"/>
    </clipPath>
  </defs>

  <!-- Fondo principal -->
  <rect width="1400" height="600" fill="url(#bgGrad)"/>
  <rect width="1400" height="600" fill="url(#glow1)"/>
  <rect width="1400" height="600" fill="url(#glow2)"/>

  <!-- Patrón de puntos decorativos -->
  <g opacity="0.08">
    <circle cx="100" cy="100" r="3" fill="#e65100"/>
    <circle cx="200" cy="50" r="2" fill="#c62828"/>
    <circle cx="350" cy="120" r="3" fill="#e65100"/>
    <circle cx="500" cy="80" r="2" fill="#c62828"/>
    <circle cx="650" cy="140" r="3" fill="#e65100"/>
    <circle cx="1100" cy="80" r="3" fill="#e65100"/>
    <circle cx="1250" cy="150" r="2" fill="#c62828"/>
    <circle cx="1350" cy="100" r="3" fill="#e65100"/>
    <circle cx="80" cy="500" r="2" fill="#c62828"/>
    <circle cx="180" cy="450" r="3" fill="#e65100"/>
    <circle cx="300" cy="520" r="2" fill="#c62828"/>
  </g>

  <!-- Líneas decorativas onduladas -->
  <path d="M0,580 Q350,540 700,560 Q1050,580 1400,550" fill="none" stroke="#c62828" stroke-width="1" opacity="0.15"/>
  <path d="M0,590 Q350,555 700,572 Q1050,590 1400,562" fill="none" stroke="#e65100" stroke-width="0.5" opacity="0.1"/>

  <!-- ─── LADO IZQUIERDO: Texto y contenido ─── -->

  <!-- Badge animado -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="21" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="white" fill-opacity="0.9">
      Gastronomía de Ibagué
    </text>
  </g>

  <!-- Título principal -->
  <text x="80" y="200" font-family="system-ui,sans-serif" font-size="58" font-weight="800" fill="white" filter="url(#textGlow)">
    El sabor de
  </text>
  <text x="80" y="268" font-family="system-ui,sans-serif" font-size="58" font-weight="800" fill="white">
    Ibagué,
  </text>
  <!-- "en tu puerta" en color acento -->
  <text x="80" y="336" font-family="system-ui,sans-serif" font-size="52" font-weight="800" fill="#f97316">
    en tu puerta
  </text>

  <!-- Descripción -->
  <text x="80" y="390" font-family="system-ui,sans-serif" font-size="17" fill="white" fill-opacity="0.7">
    Tamales, lechona, café y más — directo
  </text>
  <text x="80" y="412" font-family="system-ui,sans-serif" font-size="17" fill="white" fill-opacity="0.7">
    de los mejores restaurantes de la ciudad.
  </text>

  <!-- Stats -->
  <g transform="translate(80, 450)">
    <!-- Stat 1 -->
    <g>
      <rect x="0" y="0" width="110" height="52" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
      <text x="55" y="22" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle">22</text>
      <text x="55" y="40" font-family="system-ui,sans-serif" font-size="10" fill="white" fill-opacity="0.6" text-anchor="middle">Restaurantes</text>
    </g>
    <!-- Stat 2 -->
    <g transform="translate(125, 0)">
      <rect x="0" y="0" width="110" height="52" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
      <text x="55" y="22" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle">25m</text>
      <text x="55" y="40" font-family="system-ui,sans-serif" font-size="10" fill="white" fill-opacity="0.6" text-anchor="middle">Entrega prom.</text>
    </g>
    <!-- Stat 3 -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="110" height="52" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
      <text x="55" y="22" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="#f97316" text-anchor="middle">★ 4.8</text>
      <text x="55" y="40" font-family="system-ui,sans-serif" font-size="10" fill="white" fill-opacity="0.6" text-anchor="middle">Calificación</text>
    </g>
  </g>

  <!-- ─── LADO DERECHO: Ilustración de plato ─── -->

  <!-- Círculo de fondo iluminado -->
  <circle cx="980" cy="300" r="240" fill="#c62828" fill-opacity="0.08"/>
  <circle cx="980" cy="300" r="200" fill="#e65100" fill-opacity="0.06"/>

  <!-- Plato principal (lechona / plato típico) -->
  <g transform="translate(980, 310)" filter="url(#softShadow)">
    <!-- Sombra del plato -->
    <ellipse cx="0" cy="175" rx="160" ry="20" fill="#000000" fill-opacity="0.3"/>

    <!-- Plato base -->
    <ellipse cx="0" cy="160" rx="155" ry="22" fill="#e8e0d8"/>
    <ellipse cx="0" cy="155" rx="155" ry="22" fill="url(#plateGrad)"/>
    <ellipse cx="0" cy="150" rx="148" ry="20" fill="#f8f4f0"/>

    <!-- Borde decorativo del plato -->
    <ellipse cx="0" cy="150" rx="148" ry="20" fill="none" stroke="#d4c8be" stroke-width="2"/>
    <ellipse cx="0" cy="150" rx="135" ry="17" fill="none" stroke="#e8e0d8" stroke-width="1"/>

    <!-- Comida en el plato — lechona / arroz -->
    <ellipse cx="0" cy="140" rx="110" ry="16" fill="#c8a882"/>
    <!-- Arroz -->
    <ellipse cx="-20" cy="135" rx="55" ry="12" fill="#f5e6c8"/>
    <ellipse cx="-18" cy="133" rx="52" ry="10" fill="#fdf0d5"/>
    <!-- Carne (lechona) -->
    <ellipse cx="35" cy="132" rx="60" ry="14" fill="#8b3a1a"/>
    <ellipse cx="38" cy="128" rx="55" ry="11" fill="#a04520"/>
    <ellipse cx="40" cy="125" rx="48" ry="9" fill="#c05828"/>
    <!-- Detalles de la carne -->
    <ellipse cx="30" cy="123" rx="18" ry="5" fill="#8b3a1a" fill-opacity="0.6"/>
    <ellipse cx="52" cy="121" rx="14" ry="4" fill="#8b3a1a" fill-opacity="0.5"/>
    <!-- Arvejas verdes -->
    <circle cx="-40" cy="130" r="5" fill="#4a7c3f"/>
    <circle cx="-28" cy="127" r="4" fill="#5a8c4f"/>
    <circle cx="-50" cy="125" r="4" fill="#4a7c3f"/>
    <circle cx="-15" cy="128" r="3" fill="#5a8c4f"/>
    <!-- Ají rojo -->
    <ellipse cx="-55" cy="132" rx="12" ry="5" fill="#c62828" transform="rotate(-20, -55, 132)"/>
    <ellipse cx="-53" cy="130" rx="10" ry="4" fill="#e53935" transform="rotate(-20, -53, 130)"/>

    <!-- Arepa de chócolo -->
    <ellipse cx="-80" cy="148" rx="35" ry="8" fill="#f5c842"/>
    <ellipse cx="-80" cy="145" rx="33" ry="7" fill="#fdd835"/>
    <ellipse cx="-80" cy="143" rx="30" ry="6" fill="#ffee58"/>
    <!-- Textura arepa -->
    <ellipse cx="-80" cy="142" rx="25" ry="4" fill="none" stroke="#f5c842" stroke-width="1" fill-opacity="0"/>

    <!-- Vapor animado -->
    <g opacity="0.5">
      <path d="M-10,-20 Q-5,-35 -10,-50 Q-15,-65 -10,-80" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="d" values="M-10,-20 Q-5,-35 -10,-50 Q-15,-65 -10,-80;M-10,-20 Q-15,-35 -10,-50 Q-5,-65 -10,-80;M-10,-20 Q-5,-35 -10,-50 Q-15,-65 -10,-80" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M20,-15 Q25,-30 20,-45 Q15,-60 20,-75" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="d" values="M20,-15 Q25,-30 20,-45 Q15,-60 20,-75;M20,-15 Q15,-30 20,-45 Q25,-60 20,-75;M20,-15 Q25,-30 20,-45 Q15,-60 20,-75" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M-35,-10 Q-30,-25 -35,-40 Q-40,-55 -35,-70" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Emojis flotantes animados alrededor del plato -->
  <text x="780" y="160" font-size="36" text-anchor="middle" opacity="0.85">
    🍲
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="1180" y="180" font-size="30" text-anchor="middle" opacity="0.8">
    ☕
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="2.5s" repeatCount="indefinite"/>
  </text>
  <text x="820" y="460" font-size="28" text-anchor="middle" opacity="0.75">
    🌶️
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="1160" y="450" font-size="32" text-anchor="middle" opacity="0.8">
    🥗
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0" dur="3.2s" repeatCount="indefinite"/>
  </text>
  <text x="1280" y="280" font-size="26" text-anchor="middle" opacity="0.7">
    🍔
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="2.8s" repeatCount="indefinite"/>
  </text>
  <text x="760" y="320" font-size="24" text-anchor="middle" opacity="0.65">
    🫔
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="3.8s" repeatCount="indefinite"/>
  </text>

  <!-- Partículas decorativas animadas -->
  <circle cx="850" cy="200" r="3" fill="#f97316" opacity="0.6">
    <animate attributeName="cy" values="200;190;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="380" r="4" fill="#c62828" opacity="0.5">
    <animate attributeName="cy" values="380;368;380" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="420" r="2.5" fill="#fdd835" opacity="0.7">
    <animate attributeName="cy" values="420;412;420" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1200" cy="150" r="3" fill="#4ade80" opacity="0.5">
    <animate attributeName="cy" values="150;142;150" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Línea divisoria decorativa -->
  <line x1="700" y1="80" x2="700" y2="520" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>

  <!-- Marca de agua sutil -->
  <text x="1380" y="590" font-family="system-ui,sans-serif" font-size="11" fill="white" fill-opacity="0.2" text-anchor="end">
    Sabor Tolima · Ibagué, Colombia
  </text>
</svg>
